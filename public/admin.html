<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Soporte TI KHK</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm py-4 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="logo.png" alt="Grupo Huerta Logo" class="h-10 w-auto object-contain">
            <span class="font-mono font-bold text-sm text-slate-500"> // PANEL TI</span>
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-wider font-mono">
            GESTIÓN DE TICKETS
        </h1>
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition">
                + Ir al Formulario
            </a>
            <button id="btnCerrarSesion" class="text-xs font-semibold bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-xl transition border border-red-200">
                Cerrar Sesión
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto w-full p-6 my-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Tickets Recientes</h2>
                <p class="text-sm text-slate-500">Listado general de incidencias reportadas por las sucursales.</p>
            </div>
            <button id="btnActualizar" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow transition cursor-pointer">
                🔄 Actualizar Lista
            </button>
        </div>

        <!-- Tabla de Tickets -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 font-mono text-xs uppercase tracking-wider">
                            <th class="p-4">ID / Fecha</th>
                            <th class="p-4">Sucursal</th>
                            <th class="p-4">Solicitante</th>
                            <th class="p-4">Categoría</th>
                            <th class="p-4">Urgencia</th>
                            <th class="p-4">Descripción</th>
                            <th class="p-4">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTickets" class="divide-y divide-slate-200 text-slate-700">
                        <!-- Los tickets se cargarán aquí dinámicamente con JavaScript -->
                        <tr>
                            <td colspan="7" class="p-6 text-center text-slate-400">Cargando tickets...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 font-mono">
        Grupo Huerta // Panel de Control TI &copy; 2026
    </footer>

    <!-- Script de Protección y Cierre de Sesión -->
    <script>
        // Validar si está autenticado
        if (sessionStorage.getItem('auth_ti') !== 'true') {
            window.location.href = 'login.html';
        }

        // Botón para cerrar sesión de manera segura
        document.getElementById('btnCerrarSesion').addEventListener('click', function() {
            sessionStorage.removeItem('auth_ti');
            window.location.href = 'login.html';
        });
    </script>

    <!-- Script de Administración -->
    <script type="module" src="admin.js"></script>
</body>
</html>
