<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - Soporte TI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm py-4 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <img src="logo.png" alt="Grupo Huerta Logo" class="h-10 w-auto object-contain">
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-wider font-mono">
            ACCESO ADMINISTRADOR
        </h1>
        <div>
            <a href="index.html" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl transition">
                ← Volver al Portal
            </a>
        </div>
    </header>

    <!-- Contenido Principal (Formulario de Login) -->
    <main class="max-w-md mx-auto w-full p-8 my-auto bg-slate-50 border border-slate-200 rounded-2xl shadow-xl">
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Iniciar Sesión</h2>
            <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales de Soporte TI.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <!-- Usuario -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                <input type="text" id="usuario" required placeholder="Ej. Administrador" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition">
            </div>

            <!-- Contraseña -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition">
            </div>

            <!-- Mensaje de Error -->
            <div id="errorMsg" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-xl text-center font-medium border border-red-200">
                Usuario o contraseña incorrectos.
            </div>

            <!-- Botón de Entrar -->
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                Ingresar al Panel
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 font-mono">
        Grupo Huerta // Departamento de TI &copy; 2026
    </footer>

    <!-- Script de validación de login -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const usuarioInput = document.getElementById('usuario').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Credenciales requeridas
            if (usuarioInput === 'Administrador' && passwordInput === 'ZAQ12wsx') {
                // Guardar una banderita de sesión en el navegador
                sessionStorage.setItem('auth_ti', 'true');
                // Redireccionar al panel de administración
                window.location.href = 'admin.html';
            } else {
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
