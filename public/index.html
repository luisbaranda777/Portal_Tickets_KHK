<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda TI - KAWASAKI´S y ESMERALDA HARLEY D.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Header con temática TI -->
    <header class="bg-slate-900 border-b border-slate-800 text-cyan-400 text-center py-5 font-mono font-bold text-xl tracking-wider shadow-lg">
        💻 PORTAL DE SOPORTE TI // KHK SYSTEMS
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-3xl mx-auto w-full p-8 my-8 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl shadow-2xl">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Crear Nuevo Ticket</h2>
                <p class="text-sm text-slate-400 mt-1">Ingresa los datos para reportar una incidencia con tu equipo o sistema.</p>
            </div>
            <span class="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs font-mono rounded-full">Sistemas Activos</span>
        </div>

        <form id="ticketForm" class="space-y-5">
            <!-- Sucursal -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Sucursal</label>
                <select id="sucursal" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition">
                    <option value="">Selecciona una sucursal...</option>
                    <option value="Kawasaki Satelite">Kawasaki Satélite</option>
                    <option value="Insurgentes Sur">Insurgentes Sur</option>
                    <option value="Esmeralda Harley">Esmeralda Harley</option>
                </select>
            </div>

            <!-- Solicitante -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Tu Nombre</label>
                <input type="text" id="solicitante" required placeholder="Ej. Juan Pérez" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition">
            </div>

            <!-- Categoría / Parámetro -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Categoría del Problema</label>
                <select id="categoria" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition">
                    <option value="">Selecciona una categoría...</option>
                    <option value="Hardware (PC/Impresoras/Laptops/Celulares)">Hardware (PC / Impresoras / Laptops / Celulares)</option>
                    <option value="Sistemas (GDS/BPRO)">Sistemas (GDS / BPRO)</option>
                    <option value="Redes / Internet">Redes / Internet</option>
                    <option value="Accesos / Contraseñas">Accesos / Contraseñas</option>
                </select>
            </div>

            <!-- Descripción -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Descripción Detallada</label>
                <textarea id="descripcion" rows="4" required placeholder="Describe detalladamente el inconveniente presentado..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition"></textarea>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-cyan-900/30 transition duration-200 cursor-pointer">
                🚀 Enviar Ticket a Soporte TI
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-900 font-mono">
        Departamento de TI KHK &copy; 2026 // 2 Agentes en línea
    </footer>

    <!-- Script JavaScript -->
    <script src="app.js"></script>
</body>
</html>
